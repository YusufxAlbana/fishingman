<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishing Mini-Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- Canvas Area -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <svg class="coin-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="orange" stroke-width="2" fill="#f1c40f"/><text x="50%" y="50%" text-anchor="middle" dy=".3em" font-size="14" fill="#d35400">$</text></svg>
            <span id="money-display">0</span>
        </div>

        <!-- UI: Vertical Progress Bar -->
        <div id="progress-container" class="hidden">
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div id="progress-icon">🎣</div>
        </div>

        <!-- SCREEN: Welcome -->
        <div id="welcome-screen" class="screen">
            <h1 class="game-title">Mancing Mania</h1>
            <div class="btn-group">
                <button id="play-btn" class="big-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg> 
                    Main
                </button>
                <button id="collection-btn" class="big-btn secondary">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M7 1h10l4 4v14l-4 4H7l-4-4V5l4-4zm0 2v14h10V3H7zm2 2h6v2H9V5zm0 4h6v2H9V9zm0 4h6v2H9v-2z"/></svg> 
                    Koleksi
                </button>
            </div>
        </div>

        <!-- SCREEN: Collection -->
        <div id="collection-screen" class="screen hidden">
            <div class="screen-header">
                <h2>Koleksi Ikan</h2>
                <button id="back-home-btn" class="back-btn">Kembali</button>
            </div>
            <div id="collection-grid">
                <!-- Items populated by JS -->
                <p style="color:white">Memuat data...</p>
            </div>
        </div>

        <!-- UI: Result Screen (Hidden by default) -->
        <div id="result-modal" class="hidden">
            <div class="modal-content">
                <h2>Tangkap!</h2>
                <p id="catch-message">Kamu mendapatkan: Ikan Lele</p>
                <p id="reward-message" style="color: #f1c40f; font-weight: bold;">+ $50</p>
                <button id="restart-btn">Lanjut</button>
            </div>
        </div>
        
        <!-- Controls Hint -->
        <div id="controls-hint" class="hidden">
            Gunakan <b>WASD</b> untuk menggerakkan lingkaran.<br>
            Tahan ikan di dalam lingkaran!
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
